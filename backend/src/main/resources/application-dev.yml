spring:
  application:
    name: ai-farm-strategy-backend

  datasource:
    url: jdbc:h2:mem:farmengine;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/dev-migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

app:
  jwt:
    secret: dev-secret-key-that-is-long-enough-for-hmac-sha-256-minimum-32chars
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:4173
  market:
    data-gov-in:
      base-url: ${DATA_GOV_IN_BASE_URL:https://api.data.gov.in/resource}
      resource-id: ${DATA_GOV_IN_RESOURCE_ID:9ef84268-d588-465a-a308-a864a43d0070}
      api-key: ${DATA_GOV_IN_API_KEY:}
      connect-timeout-ms: 3000
      read-timeout-ms: 10000
      page-size: 50
      max-pages: 5
    freshness-threshold-days: 7

